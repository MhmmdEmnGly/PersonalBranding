name: Taslak üret

on:
  schedule:
    # Pazartesi, Çarşamba, Cuma 06:00 UTC = 09:00 Türkiye
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:
    inputs:
      count:
        description: "Kaç taslak üretilsin?"
        default: "5"

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - name: Taslakları üret ve e-postayla gönder
        working-directory: engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PANEL_URL: ${{ vars.PANEL_URL }}
          DRAFT_COUNT: ${{ github.event.inputs.count || vars.DRAFT_COUNT || '5' }}
        run: python generate.py
